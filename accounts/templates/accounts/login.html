
<!DOCTYPE html>
<html>
<head>
    <title>SmartHire - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf0fb, #f5f7fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #2457a7;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #243b64;
            margin-bottom: 25px;
            font-size: 23px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d5dce8;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2457a7;
            box-shadow: 0 0 0 3px rgba(36, 87, 167, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #193f7c;
        }

        .error {
            background: #fff0f0;
            color: #c62828;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        a {
            color: #2457a7;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">SmartHire</div>

    <p class="subtitle">
        Recruitment Management Made Simple
    </p>

    <h2>Welcome Back!</h2>

    {% if form.errors %}
        <div class="error">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        {{ form.username }}

        <label>Password</label>
        {{ form.password }}

        <button type="submit">Login</button>
    </form>

    <p class="register">
        Don't have an account?
        <a href="{% url 'register' %}">Create Account</a>
    </p>

    <p class="back-home">
        <a href="{% url 'home' %}">← Back to Home</a>
    </p>

</div>

</body>
</html>
