
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | SmartHire</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #263238;
        }

        nav {
            background: #172554;
            color: white;
            padding: 20px 8%;
        }

        nav h2 {
            color: #60a5fa;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .errorlist {
            color: #dc2626;
            margin: 5px 0;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>SmartHire</h2>
    </nav>

    <div class="container">

        <div class="form-card">

            <h1>Post a New Job</h1>

            <p class="subtitle">
                Enter the job details to publish a new opportunity.
            </p>

            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">

                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="errorlist">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>
                {% endfor %}

                <button type="submit">Publish Job</button>

            </form>

            <a href="{% url 'my_jobs' %}" class="back-link">
                View My Posted Jobs
            </a>

        </div>

    </div>

</body>
</html>
